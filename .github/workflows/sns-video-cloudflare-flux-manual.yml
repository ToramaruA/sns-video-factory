name: SNS Video Factory - Cloudflare FLUX real image (MANUAL ONLY)

on:
  workflow_dispatch:
    inputs:
      confirm_free_plan:
        description: 'I checked the Cloudflare account is Workers FREE (NOT Paid). Generate 1 image.'
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: sns-cloudflare-flux-manual
  cancel-in-progress: false

jobs:
  one-real-image:
    if: inputs.confirm_free_plan == true
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SNS_VIDEO_CLOUDFLARE_FREE_PLAN_CONFIRMED: '1'
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      OPENAI_API_KEY: ''
      GEMINI_API_KEY: ''
      GROQ_API_KEY: ''
      REPLICATE_API_TOKEN: ''
      ANTHROPIC_API_KEY: ''
      ELEVENLABS_API_KEY: ''
      SNS_VIDEO_ENABLE_FREE_I2V_EXPERIMENT: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Require Free account and dedicated token
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Set CLOUDFLARE_ACCOUNT_ID in repository Actions secrets' >&2; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Set CLOUDFLARE_API_TOKEN in repository Actions secrets' >&2; exit 1; }
      - name: Install dependencies and build
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          npm install -g yarn@1.22.22
          yarn install --frozen-lockfile
          yarn build
      - name: Run exactly one approved FLUX image beat and render MP4
        run: |
          node lib/cli/bin.js movie experiments/05-cloudflare-flux-one-shot/mulmo_script.json --sns-free-only
          video=output/mulmo_script_ja.mp4
          test -s "$video"
          dimensions="$(ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of csv=s=x:p=0 "$video")"
          test "$dimensions" = "720x1280"
          echo 'PASS: real Cloudflare FLUX image -> original MulmoCast -> vertical MP4'
      - name: Upload result for human review
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: real-cloudflare-flux-single-image
          path: |
            output/mulmo_script_ja.mp4
            output/images/mulmo_script/**
          if-no-files-found: error
          retention-days: 3
