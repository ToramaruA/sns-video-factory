name: SNS Video Factory - local narration and moving cut (OFFLINE)

on:
  pull_request:
    paths:
      - 'src/sns-video/audio/**'
      - 'test/sns_video/test_local_narration.ts'
      - 'experiments/09-local-narration-e2e/**'
      - '.github/workflows/sns-video-local-narration-e2e.yml'
  push:
    branches:
      - main
    paths:
      - 'src/sns-video/audio/**'
      - 'test/sns_video/test_local_narration.ts'
      - 'experiments/09-local-narration-e2e/**'
      - '.github/workflows/sns-video-local-narration-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-local-narration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENAI_API_KEY: ''
      LLM_OPENAI_API_KEY: ''
      TTS_OPENAI_API_KEY: ''
      IMAGE_OPENAI_API_KEY: ''
      GEMINI_API_KEY: ''
      ANTHROPIC_API_KEY: ''
      GROQ_API_KEY: ''
      REPLICATE_API_TOKEN: ''
      ELEVENLABS_API_KEY: ''
      KOTODAMA_API_KEY: ''
      HF_TOKEN: ''
      HUGGING_FACE_HUB_TOKEN: ''
      SNS_VIDEO_ENABLE_FREE_I2V_EXPERIMENT: '0'
      MULMO_STRICT_NETWORK: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Prepare original MulmoCast and FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          npm install -g yarn@1.22.22
          yarn install --frozen-lockfile
          yarn build
      - name: Test local speech inputs and fail-closed script
        run: |
          ./node_modules/.bin/tsx --test test/sns_video/test_local_narration.ts
      - name: Run the original MulmoCast movie CLI with local audio and moving video
        run: |
          bash experiments/09-local-narration-e2e/run.sh
      - name: Save the local-audio MP4 and example MulmoScript
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: offline-voice-inputs-and-moving-cut
          path: |
            experiments/09-local-narration-e2e/generated/local-narration.json
            output/local-narration_ja.mp4
          if-no-files-found: error
          retention-days: 3
