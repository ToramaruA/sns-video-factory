name: SNS Video Factory - one-time MulmoScript schema sync

# Temporary one-time branch utility: regenerates schema once after new provider registration.
on:
  push:
    branches:
      - feat/free-i2v-provider-architecture
    paths:
      - .github/workflows/sns-video-schema-sync-once.yml

permissions:
  contents: write

jobs:
  schema-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/free-i2v-provider-architecture
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install MulmoCast dependencies
        run: |
          npm install -g yarn@1.22.22
          yarn install --frozen-lockfile
      - name: Regenerate exact MulmoScript bundled JSON schema
        run: |
          yarn schema:write
          test -s assets/schemas/mulmo_script.json
          git diff --stat -- assets/schemas/mulmo_script.json
      - name: Commit schema change on feature branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/schemas/mulmo_script.json
          if ! git diff --cached --quiet; then
            git commit -m "fix(i2v): update generated MulmoScript schema for free_i2v providers"
            git push origin HEAD:feat/free-i2v-provider-architecture
          fi
