name: Temporary SNS setup command diagnosis (no API calls)
on:
  push:
    branches:
      - restart/mulmocast-upstream-free-ai
    paths:
      - .github/workflows/sns-setup-temporary-diagnosis.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: yarn
      - name: Dependency bootstrap (no API or Chrome)
        timeout-minutes: 3
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
        run: |
          echo "DIAG 0 start $(date -u +%FT%TZ)"
          yarn install --frozen-lockfile
          echo "DIAG 0 PASS $(date -u +%FT%TZ)"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: DIAG 1 apt-get update
        timeout-minutes: 3
        run: |
          echo "DIAG 1 START $(date -u +%FT%TZ)"
          sudo apt-get update
          echo "DIAG 1 PASS $(date -u +%FT%TZ)"
      - name: DIAG 2 apt install FFmpeg and fonts
        timeout-minutes: 3
        run: |
          echo "DIAG 2 START $(date -u +%FT%TZ)"
          sudo apt-get install -y ffmpeg fonts-noto-cjk
          echo "DIAG 2 PASS $(date -u +%FT%TZ)"
      - name: DIAG 3 Puppeteer Chrome download
        timeout-minutes: 4
        run: |
          echo "DIAG 3 START $(date -u +%FT%TZ)"
          ./node_modules/.bin/puppeteer browsers install chrome
          echo "DIAG 3 PASS $(date -u +%FT%TZ)"
      - name: DIAG 4 Chrome launch
        timeout-minutes: 2
        run: |
          echo "DIAG 4 START $(date -u +%FT%TZ)"
          node --input-type=module -e 'import puppeteer from "puppeteer"; const b=await puppeteer.launch({args:["--no-sandbox","--disable-setuid-sandbox"]}); await b.close();'
          echo "DIAG 4 PASS $(date -u +%FT%TZ)"
      - name: DIAG 5 Python venv and Gradio client
        timeout-minutes: 3
        run: |
          echo "DIAG 5 START $(date -u +%FT%TZ)"
          python3 -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check gradio_client==2.7.2
          echo "DIAG 5 PASS $(date -u +%FT%TZ)"
