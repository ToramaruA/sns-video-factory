name: Free MulmoCast - 企画文から動画（Groq標準scripting）

on:
  workflow_dispatch:
    inputs:
      brief:
        description: 'SNS動画の企画・宣伝内容を日本語で入力（最大2000文字）。'
        type: string
        required: true
        default: 'クリスマスの小さな音楽会を紹介する、温かい雰囲気の短い縦型SNS動画。'
      render_movie:
        description: 'Generate the complete MP4 after checking the MulmoScript. OFF runs Groq scripting only.'
        type: boolean
        required: false
        default: false
      confirm_groq_free_plan:
        description: 'Groq organization is on Free Plan (not Developer) and I approve this script-generation request.'
        type: boolean
        required: true
        default: false
      confirm_cloudflare_free_plan:
        description: 'Cloudflare Workers account is Free (not Paid). Required ONLY for MP4 generation.'
        type: boolean
        required: false
        default: false
      confirm_gemini_free_tier:
        description: 'Gemini API project is Free Tier. Required ONLY for MP4 generation.'
        type: boolean
        required: false
        default: false
      confirm_zerogpu_trial:
        description: 'I accept the anonymous Wan ZeroGPU prototype is not production/commercial approved. Required ONLY for MP4.'
        type: boolean
        required: false
        default: false
      confirm_third_party_demo_upload:
        description: 'I consent to upload 3 AI-generated stills to a public third-party Hugging Face demo. Required ONLY for MP4.'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: sns-native-groq-scripting-free
  cancel-in-progress: false

jobs:
  brief-to-mulmoscript:
    if: inputs.confirm_groq_free_plan == true
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      SNS_VIDEO_BRIEF: ${{ inputs.brief }}
      RENDER_MOVIE: ${{ inputs.render_movie && '1' || '0' }}
      SNS_VIDEO_FREE_ONLY: '1'
      SNS_VIDEO_GROQ_FREE_PLAN_CONFIRMED: '1'
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      LLM_GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      SNS_VIDEO_CLOUDFLARE_FREE_PLAN_CONFIRMED: ${{ inputs.confirm_cloudflare_free_plan && '1' || '0' }}
      SNS_VIDEO_GEMINI_TTS_FREE_CONFIRMED: ${{ inputs.confirm_gemini_free_tier && '1' || '0' }}
      SNS_VIDEO_ENABLE_FREE_I2V_EXPERIMENT: ${{ inputs.render_movie && inputs.confirm_zerogpu_trial && '1' || '0' }}
      SNS_VIDEO_THIRD_PARTY_DEMO_CONSENT: ${{ inputs.render_movie && inputs.confirm_third_party_demo_upload && '1' || '0' }}
      SNS_VIDEO_MAX_WAN_I2V_REQUESTS: '3'
      SNS_VIDEO_PYTHON_BINARY: ${{ github.workspace }}/.venv/bin/python
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      OPENAI_API_KEY: ''
      LLM_OPENAI_API_KEY: ''
      TTS_OPENAI_API_KEY: ''
      IMAGE_OPENAI_API_KEY: ''
      REPLICATE_API_TOKEN: ''
      ELEVENLABS_API_KEY: ''
      HF_TOKEN: ''
      HUGGING_FACE_HUB_TOKEN: ''
      HF_HUB_DISABLE_IMPLICIT_TOKEN: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Preflight Free accounts and opt-in BEFORE Groq request
        env:
          CF_OK: ${{ inputs.confirm_cloudflare_free_plan && '1' || '0' }}
          GEMINI_OK: ${{ inputs.confirm_gemini_free_tier && '1' || '0' }}
          WAN_OK: ${{ inputs.confirm_zerogpu_trial && '1' || '0' }}
          UPLOAD_OK: ${{ inputs.confirm_third_party_demo_upload && '1' || '0' }}
        run: |
          test -n "$GROQ_API_KEY" || { echo 'GROQ_API_KEY secret missing. Configure a Free Plan Groq key first.' >&2; exit 1; }
          test -n "$SNS_VIDEO_BRIEF" || { echo 'Enter a brief.' >&2; exit 1; }
          if [ "$RENDER_MOVIE" = 1 ]; then
            for consent in "$CF_OK" "$GEMINI_OK" "$WAN_OK" "$UPLOAD_OK"; do
              test "$consent" = 1 || { echo 'All four movie-related confirmations are required before ANY API requests.' >&2; exit 1; }
            done
            test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Missing CLOUDFLARE_ACCOUNT_ID' >&2; exit 1; }
            test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing CLOUDFLARE_API_TOKEN' >&2; exit 1; }
            test -n "$GEMINI_API_KEY" || { echo 'Missing GEMINI_API_KEY' >&2; exit 1; }
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: yarn
      - name: Prepare original MulmoCast
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
        run: |
          yarn install --frozen-lockfile
          yarn build
      - name: Write the user's brief to a local text input
        run: |
          mkdir -p output/sns-script
          python3 - <<'PY'
          import os, pathlib
          brief = os.environ['SNS_VIDEO_BRIEF'].strip()
          assert 1 <= len(brief) <= 2000, 'Brief must have 1..2000 characters'
          pathlib.Path('output/sns-script/brief.txt').write_text(brief + '\n', encoding='utf-8')
          PY
      - name: Original MulmoCast scripting with Groq Free (no bespoke planner)
        run: |
          node lib/cli/bin.js tool scripting --input-file output/sns-script/brief.txt --template sns_free_vertical --llm groq --llm_model openai/gpt-oss-20b --outdir output/sns-script --script sns-plan
          shopt -s nullglob
          files=(output/sns-script/sns-plan-*.json)
          test "${#files[@]}" -eq 1 || { echo 'Groq did not write exactly one MulmoScript JSON.' >&2; exit 1; }
          echo "PLAN_FILE=${files[0]}" >> "$GITHUB_ENV"
          echo "PLAN_NAME=$(basename "${files[0]}" .json)" >> "$GITHUB_ENV"
      - name: Validate generated MulmoScript and reject paid models before MP4
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import { mulmoScriptSchema } from './lib/types/schema.js';
          const file = process.env.PLAN_FILE;
          const data = mulmoScriptSchema.parse(JSON.parse(fs.readFileSync(file, 'utf8')));
          const requireSetting = (valid, label) => { if (!valid) throw new Error('Free SNS template was not respected: ' + label); };
          requireSetting(data.lang === 'ja', 'lang');
          requireSetting(data.canvasSize?.width === 720 && data.canvasSize?.height === 1280, 'vertical 720x1280');
          requireSetting(data.imageParams?.provider === 'cloudflare_free' && data.imageParams?.model === '@cf/black-forest-labs/flux-2-klein-4b', 'Cloudflare image');
          requireSetting(data.movieParams?.provider === 'wan22_trial' && data.movieParams?.model === 'wan2.2-i2v' && data.movieParams?.firstFrameImageName === '$beatImage', 'Wan I2V');
          requireSetting(data.audioParams?.suppressSpeech === false && data.captionParams?.lang === 'ja', 'speech and Japanese captions');
          const speaker = data.speechParams?.speakers?.Presenter;
          requireSetting(speaker?.provider === 'gemini' && speaker?.model === 'gemini-3.8-flash-tts', 'Gemini Free Tier narration');
          requireSetting(data.beats?.length === 3, 'exactly three cuts');
          for (const [i, beat] of data.beats.entries()) {
            requireSetting(beat.duration === 2, 'beat ' + i + ' two-second I2V duration');
            requireSetting(beat.speaker === 'Presenter' && !!beat.text?.trim(), 'beat ' + i + ' narration');
            requireSetting(!!beat.imagePrompt?.trim() && !!beat.moviePrompt?.trim(), 'beat ' + i + ' image and movie prompts');
            requireSetting(!beat.htmlPrompt && !beat.soundEffectPrompt && !beat.enableLipSync && !beat.image && !beat.audio, 'beat ' + i + ' unauthorized generation/source');
            requireSetting(!beat.imageParams && !beat.movieParams && !beat.speechParams && !beat.audioParams, 'beat ' + i + ' no per-beat paid provider overrides');
          }
          requireSetting(!data.audioParams?.bgm && !data.imageParams?.images && !data.movieParams?.referenceImages, 'no external or paid resources');
          console.log('PASS: Original MulmoScript schema, 3 real I2V beats, Groq->Cloudflare/Wan/Gemini Free settings');
          JS
      - name: Upload generated editable MulmoScript (available even when video rendering is disabled)
        uses: actions/upload-artifact@v4
        with:
          name: free-groq-mulmoscript
          path: |
            output/sns-script/brief.txt
            output/sns-script/sns-plan-*.json
          if-no-files-found: error
          retention-days: 5
      - uses: actions/setup-python@v5
        if: inputs.render_movie == true
        with:
          python-version: '3.13'
      - name: Prepare FFmpeg, browser and Wan Python demo, then test Chrome BEFORE AI generation
        if: inputs.render_movie == true
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk
          ./node_modules/.bin/puppeteer browsers install chrome
          node --input-type=module -e 'import puppeteer from "puppeteer"; const b=await puppeteer.launch({args:["--no-sandbox","--disable-setuid-sandbox"]}); await b.close();'
          python3 -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check gradio_client==2.7.2
      - name: Original MulmoCast movie renders Groq's editable MulmoScript
        if: inputs.render_movie == true
        run: |
          node lib/cli/bin.js movie "$PLAN_FILE"
          video="output/${PLAN_NAME}_ja__ja.mp4"
          test -s "$video"
          dims="$(ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of csv=s=x:p=0 "$video")"
          test "$dims" = '720x1280'
          for i in 0 1 2; do
            test -s "output/images/${PLAN_NAME}/${i}.mov"
          done
          ffprobe -v error -select_streams a:0 -show_entries stream=codec_name -of default=noprint_wrappers=1:nokey=1 "$video" | grep -q .
          ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 "$video"
          echo "PASS: Groq Free native MulmoScript -> original MulmoCast 3 moving cuts with Japanese narration"
      - name: Save finished SNS MP4
        if: success() && inputs.render_movie == true
        uses: actions/upload-artifact@v4
        with:
          name: free-groq-full-mulmocast-video
          path: |
            output/sns-plan-*_ja__ja.mp4
            output/images/sns-plan-*/
          if-no-files-found: error
          retention-days: 3
