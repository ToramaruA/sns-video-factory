name: Free MulmoCast - 文章から縦型動画（無料枠・音声任意）

on:
  workflow_dispatch:
    inputs:
      brief:
        description: 'Describe the SNS video you want (Japanese, max 3500 chars). AI chooses 1-12 shots and timing.'
        type: string
        required: true
      verify_browser_http_end_to_end:
        description: 'Also verify actual browser API -> Free Plan -> MulmoCast -> MP4 download. One generation only (not duplicate).'
        type: boolean
        required: false
        default: false
      enable_free_japanese_voice:
        description: 'Use locally run VOICEVOX Nemo Japanese narration (no paid TTS API; requires credit).'
        type: boolean
        required: false
        default: false
      confirm_nemo_credit:
        description: 'If enabling Nemo, I will credit VOICEVOX Nemo in the published video or post.'
        type: boolean
        required: false
        default: false
      confirm_groq_free_plan:
        description: 'I verified this Groq organization uses the FREE Plan (not Developer).'
        type: boolean
        required: true
        default: false
      confirm_cloudflare_free_plan:
        description: 'I verified this Cloudflare Workers account is FREE (not Paid). Generate 1-12 images (up to the Free Tier limits).'
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: sns-groq-flux-free-manual
  cancel-in-progress: false

jobs:
  free-preview:
    if: inputs.confirm_groq_free_plan == true && inputs.confirm_cloudflare_free_plan == true
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SNS_VIDEO_BRIEF: ${{ inputs.brief }}
      SNS_VIDEO_GROQ_FREE_PLAN_CONFIRMED: '1'
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      LLM_GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      SNS_VIDEO_CLOUDFLARE_FREE_PLAN_CONFIRMED: '1'
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      OPENAI_API_KEY: ''
      LLM_OPENAI_API_KEY: ''
      TTS_OPENAI_API_KEY: ''
      IMAGE_OPENAI_API_KEY: ''
      ANTHROPIC_API_KEY: ''
      ANTHROPIC_API_TOKEN: ''
      GEMINI_API_KEY: ''
      REPLICATE_API_TOKEN: ''
      ELEVENLABS_API_KEY: ''
      SNS_VIDEO_ENABLE_FREE_I2V_EXPERIMENT: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Require both free-plan keys
        run: |
          test -n "$GROQ_API_KEY" || { echo 'Missing GROQ_API_KEY secret' >&2; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Missing CLOUDFLARE_ACCOUNT_ID secret' >&2; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing CLOUDFLARE_API_TOKEN secret' >&2; exit 1; }
      - name: Prepare existing MulmoCast and FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          npm install -g yarn@1.22.22
          yarn install --frozen-lockfile
          yarn build
      - name: Require VOICEVOX Nemo attribution agreement before engine download
        if: inputs.enable_free_japanese_voice == true
        run: |
          test "${{ inputs.confirm_nemo_credit }}" = 'true' || { echo 'VOICEVOX Nemo attribution agreement is required' >&2; exit 1; }
      - name: Existing GraphAI creates a flexible-cut MulmoScript
        if: inputs.verify_browser_http_end_to_end != true
        run: |
          ./node_modules/.bin/tsx experiments/06-groq-planning/run.ts
      - name: Preserve plan and make a safe still-only render script
        if: inputs.verify_browser_http_end_to_end != true
        run: |
          ./node_modules/.bin/tsx experiments/07-groq-flux-three-cut/prepare_preview.ts
      - name: Start VOICEVOX Nemo locally (optional CPU TTS, no cloud account)
        if: inputs.enable_free_japanese_voice == true
        run: |
          docker run -d --rm --name sns-voicevox-nemo -e VV_PORT=50021 -p 127.0.0.1:50021:50021 voicevox/voicevox_nemo_engine:cpu-ubuntu20.04-latest
          ready=0
          for i in $(seq 1 60); do
            if curl --max-time 3 -fsS http://127.0.0.1:50021/speakers -o /dev/null; then ready=1; break; fi
            sleep 3
          done
          test "$ready" = 1 || { docker logs sns-voicevox-nemo; echo 'VOICEVOX Nemo did not start' >&2; exit 1; }
      - name: Render local WAV narrations and add existing MulmoCast beat.audio references
        if: inputs.enable_free_japanese_voice == true && inputs.verify_browser_http_end_to_end != true
        run: python3 experiments/07-groq-flux-three-cut/add_nemo_narration.py
      - name: Original MulmoCast generates all stills and renders portrait MP4
        if: inputs.verify_browser_http_end_to_end != true
        run: |
          node lib/cli/bin.js movie experiments/07-groq-flux-three-cut/generated/three-cut-preview.json --sns-free-only
          video=output/three-cut-preview_ja.mp4
          test -s "$video"
          dimensions="$(ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of csv=s=x:p=0 "$video")"
          test "$dimensions" = "720x1280"
          python3 -c 'import json,subprocess,sys; p=json.load(open(sys.argv[2])); n=len(p["beats"]); expected=sum(b["duration"] for b in p["beats"]); actual=float(subprocess.check_output(["ffprobe","-v","error","-show_entries","format=duration","-of","default=noprint_wrappers=1:nokey=1",sys.argv[1]])); assert 1<=n<=12,(n,expected); assert abs(actual-expected)<1.0,(actual,expected); print(f"PASS: {n} cuts, {actual:.1f}s / requested {expected:.1f}s, portrait MP4 (still images; optional recorded/local Nemo voice)")' "$video" experiments/07-groq-flux-three-cut/generated/three-cut-preview.json
      - name: Browser HTTP integration with real Groq/Cloudflare Free APIs (manual only)
        if: inputs.verify_browser_http_end_to_end == true
        env:
          SNS_VIDEO_WEB_SMOKE_CONFIRMED: '1'
          SNS_VIDEO_WEB_SMOKE_VOICE: ${{ inputs.enable_free_japanese_voice }}
          SNS_VIDEO_WEB_SMOKE_CREDIT: ${{ inputs.confirm_nemo_credit }}
        run: node scripts/sns-video-browser-live-smoke.mjs
      - name: Save plan, still preview and generated images
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: free-mulmocast-portrait-still-video
          path: |
            experiments/06-groq-planning/generated/sns-video-plan.json
            experiments/07-groq-flux-three-cut/generated/three-cut-preview.json
            output/three-cut-preview_ja.mp4
            output/sns-video-browser-smoke/**
            experiments/07-groq-flux-three-cut/generated/VOICE_ATTRIBUTION.txt
            output/images/three-cut-preview/**
          if-no-files-found: error
          retention-days: 3
      - name: Stop local Nemo engine
        if: always() && inputs.enable_free_japanese_voice == true
        run: docker rm -f sns-voicevox-nemo || true
