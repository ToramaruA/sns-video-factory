name: SNS Video Factory - Groq Free planning (MANUAL ONLY)

on:
  workflow_dispatch:
    inputs:
      confirm_groq_free_plan:
        description: 'I verified this Groq organization is on its FREE Plan (not Developer). Generate one 3-cut storyboard.'
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: sns-groq-free-planning-manual
  cancel-in-progress: false

jobs:
  one-groq-plan:
    if: inputs.confirm_groq_free_plan == true
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SNS_VIDEO_GROQ_FREE_PLAN_CONFIRMED: '1'
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      LLM_GROQ_API_KEY: ''
      OPENAI_API_KEY: ''
      ANTHROPIC_API_KEY: ''
      ANTHROPIC_API_TOKEN: ''
      GEMINI_API_KEY: ''
      REPLICATE_API_TOKEN: ''
      CLOUDFLARE_API_TOKEN: ''
      SNS_VIDEO_CLOUDFLARE_FREE_PLAN_CONFIRMED: '0'
      SNS_VIDEO_ENABLE_FREE_I2V_EXPERIMENT: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Ensure a Groq key was stored in repository Actions secrets
        run: |
          test -n "$GROQ_API_KEY" || { echo 'Missing GROQ_API_KEY in this repository Settings > Secrets and variables > Actions' >&2; exit 1; }
      - name: Install project dependencies (text generation needs no FFmpeg or GPU)
        run: |
          npm install -g yarn@1.22.22
          yarn install --frozen-lockfile
      - name: Real Groq Free Plan generates 3-shot script; no image/movie API calls
        run: |
          ./node_modules/.bin/tsx experiments/06-groq-planning/run.ts
      - name: Save validated storyboard for inspection
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: groq-free-three-cut-mulmoscript
          path: experiments/06-groq-planning/generated/sns-video-plan.json
          if-no-files-found: error
          retention-days: 3
