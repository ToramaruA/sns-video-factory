name: Free MulmoCast - 3カット一括生成（画像・動画・音声・字幕）

on:
  workflow_dispatch:
    inputs:
      render_mode:
        description: 'onepass_narrated: generate all visuals and Japanese speech at once; other options are prior experiments.'
        type: choice
        required: true
        default: onepass_narrated
        options:
          - onepass_narrated
          - narrated_from_artifact
          - three_all_moving
          - three_cut
          - one_cut
      source_run_id:
        description: 'Existing successful 3-moving-cut run ID to reuse. No Wan/Cloudflare generation in narrated mode.'
        type: string
        required: true
        default: '44319782951'
      confirm_gemini_free_tier:
        description: 'My Gemini API project/key is actually on the FREE tier; I approve sending short Japanese narration text to Gemini TTS.'
        type: boolean
        required: true
        default: false
      confirm_cloudflare_free_plan:
        description: 'I verified Cloudflare Workers is FREE, not Paid.'
        type: boolean
        required: true
        default: false
      confirm_zerogpu_trial:
        description: 'I agree this is only an anonymous ZeroGPU demo experiment, NOT a production or commercial route.'
        type: boolean
        required: true
        default: false
      confirm_third_party_demo_upload:
        description: 'I agree to send up to THREE generated non-private images to a public Hugging Face demo (depending on render_mode).'
        type: boolean
        required: true
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: sns-one-moving-cut-restart-prototype
  cancel-in-progress: false

jobs:
  render-beats:
    if: (inputs.render_mode == 'narrated_from_artifact' && inputs.confirm_gemini_free_tier == true) || (inputs.render_mode != 'narrated_from_artifact' && inputs.confirm_cloudflare_free_plan == true && inputs.confirm_zerogpu_trial == true && inputs.confirm_third_party_demo_upload == true && (inputs.render_mode != 'onepass_narrated' || inputs.confirm_gemini_free_tier == true))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SNS_VIDEO_FREE_ONLY: '1'
      SNS_VIDEO_CLOUDFLARE_FREE_PLAN_CONFIRMED: '1'
      SNS_VIDEO_ENABLE_FREE_I2V_EXPERIMENT: ${{ inputs.render_mode != 'narrated_from_artifact' && '1' || '0' }}
      SNS_VIDEO_THIRD_PARTY_DEMO_CONSENT: ${{ inputs.render_mode != 'narrated_from_artifact' && '1' || '0' }}
      SNS_VIDEO_GEMINI_TTS_FREE_CONFIRMED: ${{ inputs.confirm_gemini_free_tier && '1' || '0' }}
      SNS_VIDEO_PYTHON_BINARY: ${{ github.workspace }}/.venv/bin/python
      RENDER_MODE: ${{ inputs.render_mode }}
      SNS_VIDEO_MAX_WAN_I2V_REQUESTS: ${{ (inputs.render_mode == 'three_all_moving' || inputs.render_mode == 'onepass_narrated') && '3' || '1' }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      OPENAI_API_KEY: ''
      REPLICATE_API_TOKEN: ''
      ELEVENLABS_API_KEY: ''
      HF_TOKEN: ''
      HUGGING_FACE_HUB_TOKEN: ''
      HF_HUB_DISABLE_IMPLICIT_TOKEN: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Verify selected Free Tier and credentials BEFORE running MulmoCast
        run: |
          if [ "$RENDER_MODE" = narrated_from_artifact ] || [ "$RENDER_MODE" = onepass_narrated ]; then
            test "$SNS_VIDEO_GEMINI_TTS_FREE_CONFIRMED" = 1 || { echo 'Gemini Free Tier confirmation required' >&2; exit 1; }
            test -n "$GEMINI_API_KEY" || { echo 'Missing repository secret GEMINI_API_KEY for the Gemini Free Tier project' >&2; exit 1; }
          fi
          if [ "$RENDER_MODE" != narrated_from_artifact ]; then
            test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Missing Cloudflare Account ID' >&2; exit 1; }
            test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing Cloudflare API token' >&2; exit 1; }
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: yarn
      - uses: actions/setup-python@v5
        if: inputs.render_mode != 'narrated_from_artifact'
        with:
          python-version: '3.13'
      - name: Install original MulmoCast and FFmpeg
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          yarn install --frozen-lockfile
          yarn build
      - name: Install Wan demo bridge ONLY for new I2V requests
        if: inputs.render_mode != 'narrated_from_artifact'
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check gradio_client==2.7.2
      - name: Install and preflight the browser BEFORE any AI generation
        if: inputs.render_mode == 'narrated_from_artifact' || inputs.render_mode == 'onepass_narrated'
        run: |
          sudo apt-get install -y fonts-noto-cjk
          ./node_modules/.bin/puppeteer browsers install chrome
          node --input-type=module -e 'import puppeteer from "puppeteer"; const browser = await puppeteer.launch({ args: ["--no-sandbox", "--disable-setuid-sandbox"] }); await browser.close(); console.log("PASS: Puppeteer Chrome launches before AI requests");'
      - name: Original MulmoCast renders requested moving cuts without paid video APIs
        if: inputs.render_mode != 'narrated_from_artifact'
        run: |
          case "$RENDER_MODE" in
            three_cut) name=experimental-three-cut-one-moving ;;
            three_all_moving) name=experimental-three-cut-all-moving ;;
            onepass_narrated) name=experimental-three-cut-onepass-narrated ;;
            one_cut) name=experimental-one-moving-cut ;;
            *) echo "Unknown mode" >&2; exit 1 ;;
          esac
          script="docs/sns-video/examples/${name}.json"
          python3 - "$script" "$RENDER_MODE" <<'PY'
          import json, sys
          script = json.load(open(sys.argv[1], encoding='utf-8'))
          expected = 1 if sys.argv[2] == 'one_cut' else 3
          expected_movies = 3 if sys.argv[2] in ('three_all_moving', 'onepass_narrated') else 1
          assert len(script['beats']) == expected
          assert sum(bool(b.get('moviePrompt')) for b in script['beats']) == expected_movies
          if sys.argv[2] == 'onepass_narrated':
              assert script['audioParams']['suppressSpeech'] is False
              assert script['captionParams']['lang'] == 'ja'
              assert all(beat['text'] and beat['speaker'] == 'Presenter' for beat in script['beats'])
              assert all(s['provider'] == 'gemini' and s['model'] == 'gemini-3.8-flash-tts' for s in script['speechParams']['speakers'].values())
          PY
          node lib/cli/bin.js movie "$script"
          if [ "$RENDER_MODE" = onepass_narrated ]; then
            video="output/${name}_ja__ja.mp4"
          else
            video="output/${name}_ja.mp4"
          fi
          test -s "$video"
          dimensions="$(ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of csv=s=x:p=0 "$video")"
          test "$dimensions" = "720x1280"
          if [ "$RENDER_MODE" = three_cut ]; then
            test -s "output/images/${name}/0p.png"
            test -s "output/images/${name}/1.mov"
            test -s "output/images/${name}/2p.png"
            test "$(find "output/images/${name}" -maxdepth 1 -name '*.mov' | wc -l)" -eq 1
          elif [ "$RENDER_MODE" = three_all_moving ] || [ "$RENDER_MODE" = onepass_narrated ]; then
            for idx in 0 1 2; do
              test -s "output/images/${name}/${idx}.mov"
            done
            test "$(find "output/images/${name}" -maxdepth 1 -name '*.mov' | wc -l)" -eq 3
          fi
          if [ "$RENDER_MODE" = onepass_narrated ]; then
            audio_codec="$(ffprobe -v error -select_streams a:0 -show_entries stream=codec_name -of default=noprint_wrappers=1:nokey=1 "$video")"
            test -n "$audio_codec" || { echo 'Japanese narration audio track missing' >&2; exit 1; }
          fi
          ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 "$video"
          echo "PASS: ${RENDER_MODE} rendered by original MulmoCast, with no paid video APIs"
      - name: Download saved moving cuts (not another Wan/FLUX request)
        if: inputs.render_mode == 'narrated_from_artifact'
        uses: actions/download-artifact@v4
        with:
          name: free-mulmocast-one-or-three-cut-prototype
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
          path: imported
      - name: Prepare local movie references from the earlier 3-cut artifact
        if: inputs.render_mode == 'narrated_from_artifact'
        run: |
          mkdir -p docs/sns-video/examples/narrated-assets
          for index in 0 1 2; do
            src="imported/output/images/experimental-three-cut-all-moving/${index}.mov"
            test -s "$src" || { echo "Missing original moving clip: $src" >&2; exit 1; }
            ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of default=noprint_wrappers=1:nokey=1 "$src"
            cp "$src" "docs/sns-video/examples/narrated-assets/${index}.mov"
          done
          python3 - <<'PY'
          import json
          path = "docs/sns-video/examples/experimental-three-cut-narrated.json"
          script = json.load(open(path, encoding="utf-8"))
          assert script["audioParams"]["suppressSpeech"] is False
          assert len(script["beats"]) == 3
          assert all(b.get("text") and b["image"]["type"] == "movie" and not b.get("moviePrompt") and not b.get("imagePrompt") for b in script["beats"])
          assert all(b["image"]["source"]["path"] == f"./narrated-assets/{i}.mov" for i, b in enumerate(script["beats"]))
          assert all(s["provider"] == "gemini" and s["model"] == "gemini-3.8-flash-tts" for s in script["speechParams"]["speakers"].values())
          print("PASS: existing three local video clips; Gemini narration only, no paid image/video generation")
          PY
      - name: Add Japanese narration and captions using original MulmoCast
        if: inputs.render_mode == 'narrated_from_artifact'
        run: |
          node lib/cli/bin.js movie docs/sns-video/examples/experimental-three-cut-narrated.json
          video="output/experimental-three-cut-narrated_ja__ja.mp4"
          test -s "$video"
          dimensions="$(ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of csv=s=x:p=0 "$video")"
          test "$dimensions" = "720x1280"
          audio_codec="$(ffprobe -v error -select_streams a:0 -show_entries stream=codec_name -of default=noprint_wrappers=1:nokey=1 "$video")"
          test -n "$audio_codec" || { echo 'Narration audio track missing' >&2; exit 1; }
          ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 "$video"
          echo "PASS: existing Wan movies -> Gemini Free TTS Japanese speech + captions -> original MulmoCast MP4"
      - name: Save full narrated SNS prototype
        if: success() && inputs.render_mode == 'narrated_from_artifact'
        uses: actions/upload-artifact@v4
        with:
          name: free-mulmocast-three-cut-japanese-narrated
          path: |
            docs/sns-video/examples/experimental-three-cut-narrated.json
            output/experimental-three-cut-narrated_ja__ja.mp4
          if-no-files-found: error
          retention-days: 3
      - name: Save the rendered MP4 and all generated frames
        if: success() && inputs.render_mode != 'narrated_from_artifact'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.render_mode == 'onepass_narrated' && 'free-mulmocast-onepass-voice-video' || 'free-mulmocast-one-or-three-cut-prototype' }}
          path: |
            docs/sns-video/examples/experimental-one-moving-cut.json
            docs/sns-video/examples/experimental-three-cut-one-moving.json
            docs/sns-video/examples/experimental-three-cut-all-moving.json
            docs/sns-video/examples/experimental-three-cut-onepass-narrated.json
            output/experimental-*_ja.mp4
            output/experimental-*_ja__ja.mp4
            output/images/experimental-one-moving-cut/
            output/images/experimental-three-cut-one-moving/
            output/images/experimental-three-cut-all-moving/
            output/images/experimental-three-cut-onepass-narrated/
          if-no-files-found: error
          retention-days: 3
