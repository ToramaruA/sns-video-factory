name: Free MulmoCast - 3カット動画試作（手動のみ）

on:
  workflow_dispatch:
    inputs:
      render_mode:
        description: 'Choose 3 cuts (1 Wan moving + 2 stills), or the earlier 1 moving cut.'
        type: choice
        required: true
        default: three_cut
        options:
          - three_cut
          - one_cut
      confirm_cloudflare_free_plan:
        description: 'I verified Cloudflare Workers is FREE, not Paid.'
        type: boolean
        required: true
        default: false
      confirm_zerogpu_trial:
        description: 'I agree this is only an anonymous ZeroGPU demo experiment, NOT a production or commercial route.'
        type: boolean
        required: true
        default: false
      confirm_third_party_demo_upload:
        description: 'I agree to submit ONE generated non-private robot image to a third-party public Hugging Face Space.'
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: sns-one-moving-cut-restart-prototype
  cancel-in-progress: false

jobs:
  single-moving-cut:
    if: inputs.confirm_cloudflare_free_plan == true && inputs.confirm_zerogpu_trial == true && inputs.confirm_third_party_demo_upload == true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SNS_VIDEO_FREE_ONLY: '1'
      SNS_VIDEO_CLOUDFLARE_FREE_PLAN_CONFIRMED: '1'
      SNS_VIDEO_ENABLE_FREE_I2V_EXPERIMENT: '1'
      SNS_VIDEO_THIRD_PARTY_DEMO_CONSENT: '1'
      SNS_VIDEO_PYTHON_BINARY: ${{ github.workspace }}/.venv/bin/python
      RENDER_MODE: ${{ inputs.render_mode }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      OPENAI_API_KEY: ''
      GEMINI_API_KEY: ''
      REPLICATE_API_TOKEN: ''
      ELEVENLABS_API_KEY: ''
      HF_TOKEN: ''
      HUGGING_FACE_HUB_TOKEN: ''
      HF_HUB_DISABLE_IMPLICIT_TOKEN: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Require Free-plan credentials before any API call
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Missing Cloudflare Account ID' >&2; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing Cloudflare API token' >&2; exit 1; }
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: yarn
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install original MulmoCast and the existing Wan demonstration bridge
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          yarn install --frozen-lockfile
          yarn build
          python3 -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check gradio_client==2.7.2
      - name: Original MulmoCast renders three beats, with exactly one Wan movie generation
        run: |
          case "$RENDER_MODE" in
            three_cut) name=experimental-three-cut-one-moving ;;
            one_cut) name=experimental-one-moving-cut ;;
            *) echo "Unknown mode" >&2; exit 1 ;;
          esac
          script="docs/sns-video/examples/${name}.json"
          python3 - "$script" "$RENDER_MODE" <<'PY'
          import json, sys
          script = json.load(open(sys.argv[1], encoding='utf-8'))
          expected = 3 if sys.argv[2] == 'three_cut' else 1
          assert len(script['beats']) == expected
          assert sum(bool(b.get('moviePrompt')) for b in script['beats']) == 1
          PY
          node lib/cli/bin.js movie "$script"
          video="output/${name}_ja.mp4"
          test -s "$video"
          dimensions="$(ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of csv=s=x:p=0 "$video")"
          test "$dimensions" = "720x1280"
          if [ "$RENDER_MODE" = three_cut ]; then
            test -s "output/images/${name}/0p.png"
            test -s "output/images/${name}/1.mov"
            test -s "output/images/${name}/2p.png"
            test "$(find "output/images/${name}" -maxdepth 1 -name '*.mov' | wc -l)" -eq 1
          fi
          ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 "$video"
          echo "PASS: ${RENDER_MODE}, one Wan 2-second clip, all cuts rendered by original MulmoCast"
      - name: Save the rendered MP4 and all generated frames
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: free-mulmocast-one-or-three-cut-prototype
          path: |
            docs/sns-video/examples/experimental-one-moving-cut.json
            docs/sns-video/examples/experimental-three-cut-one-moving.json
            output/experimental-*_ja.mp4
            output/images/experimental-one-moving-cut/
            output/images/experimental-three-cut-one-moving/
          if-no-files-found: error
          retention-days: 3
